<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>법숲 — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 법숲 로그인 — index.html 과 같은 체계(Warm Editorial · 숲 녹색 하나 · 명조 제목) */
:root{--paper:oklch(0.972 0.008 85);--surface:oklch(0.99 0.004 85);--sunk:oklch(0.945 0.01 85);--ink:oklch(0.2 0.015 150);--ink-2:oklch(0.42 0.018 150);--ink-3:oklch(0.56 0.015 150);--ink-4:oklch(0.7 0.01 150);
  --forest:oklch(0.43 0.085 155);--forest-2:oklch(0.36 0.075 155);--forest-wash:oklch(0.43 0.085 155 / 0.09);--line:oklch(0.2 0.02 150 / 0.08);--line-2:oklch(0.2 0.02 150 / 0.14);--err:oklch(0.5 0.16 30);
  --serif:'Noto Serif KR','AppleMyungjo',serif;--sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--ease:cubic-bezier(0.16,1,0.3,1)}
@media (prefers-color-scheme:dark){:root{--paper:oklch(0.19 0.012 155);--surface:oklch(0.225 0.014 155);--sunk:oklch(0.17 0.012 155);--ink:oklch(0.94 0.01 120);--ink-2:oklch(0.78 0.015 140);--ink-3:oklch(0.64 0.015 145);--ink-4:oklch(0.5 0.012 150);--forest:oklch(0.78 0.1 155);--forest-2:oklch(0.85 0.09 155);--forest-wash:oklch(0.78 0.1 155 / 0.12);--line:oklch(1 0 0 / 0.08);--line-2:oklch(1 0 0 / 0.14);--err:oklch(0.75 0.13 30)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);letter-spacing:-0.01em}
.side{padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line-2)}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.14em;color:var(--forest);text-transform:uppercase;margin:0}
.big{font:800 clamp(4rem,11vw,9rem)/0.9 var(--serif);letter-spacing:-0.045em;margin:18px 0 0}
.big em{font-style:normal;color:var(--forest)}
.lede{color:var(--ink-2);font-size:clamp(16px,1.5vw,18.5px);max-width:26em;margin:20px 0 0}
.fine{font-size:12.5px;color:var(--ink-4)}
.card{align-self:center;justify-self:center;width:min(380px,100% - 40px);padding:24px 0}
.card h1{font:800 26px/1.2 var(--serif);letter-spacing:-0.03em;margin:0 0 4px}
.desc{color:var(--ink-3);font-size:14px;margin:0 0 22px}
label{display:block;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
input{width:100%;font:500 16px var(--sans);padding:13px 14px;border:0;border-radius:12px;background:var(--sunk);color:var(--ink);transition:box-shadow .25s var(--ease)}
input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--forest)}
button{width:100%;font:700 15.5px var(--sans);cursor:pointer;border:0;border-radius:999px;padding:14px;margin-top:18px;transition:background .25s var(--ease),transform .25s var(--ease)}
button:active{transform:scale(.98)}button:disabled{opacity:.55;cursor:wait}
#login{background:var(--forest);color:var(--surface)}
@media (hover:hover){#login:hover{background:var(--forest-2)}#demo:hover{background:var(--forest-wash)}}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-4);font-size:12px;margin:20px 0 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-2)}
#demo{background:transparent;color:var(--forest);border:1px solid var(--forest);margin-top:14px}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin:10px 0 0}
#err{min-height:20px;color:var(--err);font-size:13px;margin-top:10px}
.rise{animation:rise .7s var(--ease) both}.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (max-width:820px){body{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line-2);padding:32px 20px 28px}.side .fine{display:none}.big{font-size:clamp(3.6rem,18vw,5rem)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="side"><div><p class="eyebrow rise">생활 · 금융 법령 RAG</p><p class="big rise d1">법<em>숲</em></p><p class="lede rise d2">일상의 법적 질문에, 법령 조문을 근거로 답합니다. 근거가 없으면 답하지 않습니다.</p></div><p class="fine">조문 안내이며 법률 자문이 아닙니다</p></aside>
<main class="card rise d1">
  <h1>들어가기</h1>
  <p class="desc">로그인하거나, 데모로 바로 써 보세요.</p>
  <form id="f" autocomplete="on">
    <label for="u">아이디</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" required autofocus>
    <label for="p">비밀번호</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div id="err" role="alert"></div>
    <button id="login" type="submit">로그인</button>
  </form>
  <div class="or">또는</div>
  <button id="demo" type="button">데모 체험하기</button>
  <p class="hint">로그인 없이 예시 질문의 답변과 법령 검색을 볼 수 있습니다.</p>
</main>
<script>
const $ = (s) => document.querySelector(s);
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  return { ok: r.ok, j: await r.json().catch(() => ({})) };
}
async function enter(btn, url, body) {
  btn.disabled = true; $('#err').textContent = '';
  try {
    const { ok, j } = await post(url, body);
    if (ok) return location.reload();
    $('#err').textContent = j.error || '실패했습니다';
  } catch { $('#err').textContent = '서버에 연결하지 못했습니다'; }
  btn.disabled = false;
}
$('#f').addEventListener('submit', (e) => { e.preventDefault(); enter($('#login'), 'api/login', { user: $('#u').value.trim(), pass: $('#p').value }); });
$('#demo').addEventListener('click', () => enter($('#demo'), 'api/demo'));
</script>
</body>
</html>
